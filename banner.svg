<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="acp-pollinations banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="180" cy="150" r="70" fill="url(#accent)" opacity="0.85"/>
  <text x="300" y="135" font-family="Segoe UI, Roboto, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">acp-pollinations</text>
  <text x="300" y="185" font-family="Segoe UI, Roboto, sans-serif" font-size="28" fill="#cbd5e1">ACP v1 coding agent powered by Pollinations</text>
  <text x="300" y="225" font-family="Segoe UI, Roboto, sans-serif" font-size="20" fill="#94a3b8">Read, edit, search, and run code — confined to your workspace.</text>
