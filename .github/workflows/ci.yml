name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the declared floor in `engines`; 24 catches drift early.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm test` builds first (see the `pretest` script), because the e2e
      # suite spawns the built binary rather than the sources.
      - name: Test
        run: npm test

      # The entry point must stay executable, or a published install cannot run it.
      - name: Check the entry point is executable
        run: test -x dist/bin/pollinations-acp-server.js
