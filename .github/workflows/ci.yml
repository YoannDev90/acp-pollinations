name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the declared floor in `engines`; 24 catches drift early.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `npm test` builds first (see the `pretest` script), because the e2e
      # suite spawns the built binary rather than the sources.
      - name: Test
        run: npm test

      # Coverage runs on one node version only: the numbers do not depend on
      # the runtime, and a second run would only double the report.
      - name: Coverage
        if: matrix.node == 22
        run: npm run coverage

      # Same guard as the coverage step: only that run writes lcov.info, so
      # the other matrix leg has nothing to upload.
      - name: Upload coverage to Codecov
        if: matrix.node == 22
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      # High and critical advisories fail the build. A registry hiccup fails
      # this step too, which is the better failure mode than skipping it.
      - name: Audit dependencies
        if: matrix.node == 22
        run: npm audit --audit-level=high

      # The entry point must stay executable, or a published install cannot run it.
      - name: Check the entry point is executable
        run: test -x dist/bin/pollinations-acp-server.js

  # Separate from `verify`: a conformance failure should not hide behind a
  # matrix result, and the suite needs a network round trip the unit tests do
  # not. It clones acp-tck and points the agent at a local fake endpoint, so
  # it needs no API key and bills nothing.
  tck:
    name: ACP conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The runner images do not ship `uv`, and `scripts/tck.ts` drives the
      # suite through it. Without this step the spawn fails before a single
      # requirement is checked, which reads as a conformance failure.
      # Pinned: this action publishes no floating `v10` tag.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Conformance
        run: npm run tck
